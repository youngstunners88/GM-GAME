name: Export Godot Game to Web

# Serialise export runs per branch.
#
# This workflow COMMITS ITS OUTPUT BACK to the branch, so two runs in flight at
# once race each other's push: the loser dies with "cannot lock ref ... is at
# <X> but expected <Y>" and reports the whole run as FAILURE even though the
# export and every gate passed. That is exactly what happened to PR #12 on
# 668dbf4 (run 30564497392) — two runs for the same commit, one pushed, the
# other was rejected and went red.
#
# cancel-in-progress is deliberately FALSE, not true: a run that is mid-push or
# mid-butler-deploy should be allowed to finish rather than be killed partway.
# Queued runs simply rebase onto whatever landed first.
concurrency:
  group: export-game-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - master
      - claude/**
      - codex/**
    paths:
      - 'src/**'
      - 'project.godot'
      - '.github/workflows/export-game.yml'
      # Runtime wiring + browser bridge affect the shipped build too — without
      # these, editing config.json (contracts/backend URL) or web/web3.js would
      # leave web/game/ and the deployed mirrors stale (PR #5 review).
      - 'config.json'
      - 'web/web3.js'
      # The pipeline's own gates live here (security-sentinel.sh, verify-*.mjs,
      # release-game.sh). Without this, editing the security gate did NOT re-run
      # the security gate — a fix to it stayed unverified while the PR kept
      # showing the stale failure it was meant to fix. Found the hard way on
      # 1f5a9a1, which triggered no workflow at all.
      - 'scripts/**'
      - 'tests/**'
      - 'tools/ep2_shots/**'
      # secure-build-checklist was relocated from scripts/ to this skill path
      # (founder request, PR #21) and immediately reproduced the EXACT bug the
      # comment above documents: the scanner and its rules moved out from under
      # the path filter, so a commit that only touched the security gate
      # (checklist.json, audit.ts) triggered NO workflow at all — silently,
      # with no error, on the very next commit after the move. Caught only by
      # noticing the PR's check-run list was empty when it should not have
      # been. `scripts/security-audit.ts` (the back-compat shim) stayed inside
      # scripts/** and so still triggered CI on its own, which is exactly how
      # this went unnoticed for one full commit.
      - '.claude/skills/secure-build-checklist/**'
      # Founder-locked front page: a change to the lock manifest alone must
      # still run the front-page check, not slip through untriggered.
      - '.claude/locks/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.3-stable"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          # REQUIRED. Without it the action calls the GitHub API anonymously to
          # work out whether this account is an org (licensed) or a user (free).
          # Anonymous calls from shared Actions runner IPs get rate-limited, and
          # when the lookup fails the action does NOT fail open — it falls back
          # to demanding a GITLEAKS_LICENSE and hard-errors, turning the whole
          # job red while the export itself succeeded. That is exactly what
          # happened on run 30462028631. Authenticating the lookup removes the
          # rate limit, so the free-for-personal-accounts path resolves.
          # This does not weaken the scan: gitleaks still runs over full history
          # and still fails the build on a real finding.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      - name: Security Sentinel
        run: ./scripts/security-sentinel.sh --fail-on=high

      # FOUNDER-LOCKED FRONT PAGE. The founder builds in several sessions in
      # parallel; his approved title screen must not change unless he says so.
      # This fails the build if any locked file differs from the fingerprints in
      # .claude/locks/front-page.lock — and on master a failed build is a build
      # that does not deploy, so a changed or reverted title screen can never
      # reach players. Runs before the export so a violation fails fast.
      # An approved change re-fingerprints in the same commit:
      #   scripts/front-page-lock.sh update
      - name: Front-page lock (founder-approved title screen)
        run: bash scripts/front-page-lock.sh check

      # Background art gate (founder 2026-09-16, "blemishes throughout different
      # stages"). Nearly every shipped backdrop carried a horizontally-smeared
      # band along its right edge, and because the backdrops TILE, that band
      # repeated across the whole level. Now that they are repaired this keeps
      # a blemished plate from ever being committed again. Deliberately
      # dependency-light: the check runs on Pillow + numpy, no OpenCV (that is
      # only needed by the one-off repair pass).
      - name: Stage 1 weapon gate
        run: |
          # The founder has asked twice for Stage 1 to throw smoke bombs, not
          # axes, and both times the source looked correct on review while the
          # live game did the wrong thing. This gate checks the structure that
          # makes the wrong thing impossible, not the presence of the right
          # scene file. See the script header.
          python3 scripts/check-stage1-weapon.py

      - name: Background art gate
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy
          # TILE-JOIN GATE (founder 2026-09-20, "why more dividing lines").
          # Every plate drawn on a mirrored ParallaxLayer butt-joins its own
          # right edge against its own left edge forever. If those do not match,
          # that join IS the dividing line. Measured as a STEP ratio normalised
          # by the plate's own column-to-column variation, so a legitimate
          # left-to-right gradient does not trip it. ~1 = seamless, >=3 = hard
          # join. Repair with: python3 scripts/make-plate-seamless.py <plate>
          python3 scripts/make-plate-seamless.py --check --max-wrap 3.0 \
            src/assets/backgrounds/bg_l1_forest.jpg \
            src/assets/backgrounds/bg_l2_crystal.jpg \
            src/assets/backgrounds/bg_l3_goldrush.jpg \
            src/assets/backgrounds/bg_blaze_l1_smoke_v2.jpg \
            src/assets/backgrounds/bg_blaze_l2_crystal_v2.jpg \
            src/assets/backgrounds/bg_blaze_l3_gold_v2.jpg
          # GREEN VFX GATE (founder 2026-09-21: green smudges "in each of the
          # stages 1, 2 and 3 as well as the Blaze Rush sections" and the Hall
          # of Blaze). Root cause was NOT backdrop art - it was
          # effects/smoke_puff.gd drawing the Blaze Mode auto-puff as a soft
          # TRANSLUCENT GREEN rect straight onto the current scene, so it washed
          # over every backdrop in the game. An image gate cannot catch that
          # reliably (the puff only exists while the player holds Blaze Mode), so
          # it is caught at the source instead.
          python3 scripts/check-green-vfx.py
          python3 scripts/repair-backgrounds.py --check
          # Founder 2026-09-18 + Fable 5.1 diagnosis. The real defect behind the
          # "sliver / dividing line / seam" was the parallax TILE-WRAP join of
          # plates that are ~viewport-wide, cutting through a dark structure. The
          # earlier tone "edge-heal" only smeared it. Real fixes:
          #  - L1/L2: ROLL the plate by ~W/2 (wrap becomes natively seamless) then
          #    REPAINT the now-interior discontinuity (repaint-wrap-seam.py). Gate
          #    = make-bg-seamless.py --check (wrap seamless, no full-height join).
          #  - Fort Knox: widen the gold plate + turn tiling OFF for it (no join).
          #    Gate = repair-fort-knox-backdrop.py --check (wide enough, no smear).
          python3 scripts/repair-fort-knox-backdrop.py --check
          python3 scripts/make-bg-seamless.py --check

      - name: Download Godot editor + export templates
        run: |
          set -euo pipefail
          mkdir -p godot
          cd godot

          EDITOR_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"

          SUMS_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/SHA512-SUMS.txt"

          echo "Downloading editor: $EDITOR_URL"
          curl -fL --retry 3 -o godot-editor.zip "$EDITOR_URL"

          # Supply-chain gate: verify both Godot downloads against the release's
          # official SHA512 sums before executing anything (audit finding #6).
          # Missing sums file = warn (release layout changed); MISMATCH = fail.
          # Plain shell var, NOT $GITHUB_ENV: verify() runs in THIS same shell,
          # and $GITHUB_ENV only propagates to *later* steps — so a missing sums
          # file must be recorded here or verify() would still grep a nonexistent
          # file and fail the export instead of skipping the gate as intended.
          SUMS_MISSING=0
          if ! curl -fL --retry 3 -o SHA512-SUMS.txt "$SUMS_URL"; then
            echo "::warning::SHA512-SUMS.txt not found on release — skipping Godot checksum gate"
            SUMS_MISSING=1
          fi
          verify() {
            [ "$SUMS_MISSING" = "1" ] && return 0
            local file=$1 name=$2
            local expected actual
            expected=$(grep " ${name}\$" SHA512-SUMS.txt | awk '{print $1}')
            if [ -z "$expected" ]; then
              echo "::error::No checksum for $name in SHA512-SUMS.txt"; exit 1
            fi
            actual=$(sha512sum "$file" | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::Checksum mismatch for $name"; exit 1
            fi
            echo "✓ checksum OK: $name"
          }
          verify godot-editor.zip "Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot-editor.zip
          EDITOR_BIN=$(find . -maxdepth 1 -name "Godot_v*_linux.x86_64" -type f | head -1)
          chmod +x "$EDITOR_BIN"
          echo "GODOT_BIN=$(pwd)/$EDITOR_BIN" >> "$GITHUB_ENV"

          echo "Downloading export templates: $TEMPLATES_URL"
          curl -fL --retry 3 -o templates.tpz "$TEMPLATES_URL"
          verify templates.tpz "Godot_v${GODOT_VERSION}_export_templates.tpz"

          # Templates must live at ~/.local/share/godot/export_templates/<version>/
          # NOTE: Godot names the dir "4.3.stable" (dot), not the release tag "4.3-stable".
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz -d /tmp/templates_extract
          # The tpz extracts into a "templates/" folder
          cp -r /tmp/templates_extract/templates/* "$TEMPLATE_DIR/"
          echo "Templates installed to $TEMPLATE_DIR:"
          ls "$TEMPLATE_DIR" | head -5

      - name: Verify Godot runs
        run: |
          "$GODOT_BIN" --version

      - name: Create export preset
        run: |
          mkdir -p web/game .godot/editor
          # CRITICAL: the heredoc below becomes res://export_presets.cfg, which
          # Godot parses with ConfigFile. ConfigFile does NOT accept `#` comments
          # — any `#` line makes the WHOLE preset fail to parse ("Unexpected
          # identifier"), Godot then reports "Invalid export preset name: Web",
          # and the export produces NO pck. That is exactly what silently
          # happened for many sessions: explanatory `#` comments had been added
          # INSIDE this heredoc, the export died, the masked pipe hid it, and the
          # stale committed build kept shipping to itch. Keep the heredoc PURE
          # key=value only. Explanations live here, as SHELL comments, OUTSIDE
          # the heredoc:
          #   export_filter=all_resources  -> bundle every res:// under the root
          #   include_filter               -> config.json + taglines are plain
          #        (non-resource) files the Web3Bridge autoload reads at runtime;
          #        without force-include the contracts/backend wiring is absent.
          #   exclude_filter docs/,tests/,prompts/,scripts/,portals/ -> dev-only dirs that
          #        all_resources would otherwise sweep into the .pck (docs/
          #        captures alone was ~15MB of dead weight).
          #   design/,work-notes/,tools/,assets/keyart/,web_verify/,web/game/ -> reference
          #        images, notes, capture rigs and local export output nothing loads at runtime
          #        (2026-10-01: ~14 MB; the Episode 2 hideout's Meshy models pushed the pck over 190 MB).
          #   src/assets/models/horse/assetfurnace/ -> the horse's raw/rigged GLBs, textures and run records (~10 MB);
          #        the stable plays the baked 2D sprites in src/assets/sprites/, no scene loads these.
          #   DO NOT exclude loose texture files next to GLBs (src/episode2/assets/{town,weapons,mine_lift,vehicles}/):
          #        gltf/embedded_image_handling=1 EXTRACTS the GLB textures to those files and the imported scene points
          #        at them. Excluding them from the pck strips every texture (rifle, lift cage, flame quad, sheriff,
          #        cowboy, bartender, minister, donkey cart all render flat white). Tried 2026-10-18 (a089786a), reverted.
          #        Probe before excluding anything: tools/ep2_forge/texture_ref_probe.gd (run by scripts/ship-to-master.sh).
          #   src/assets/sprites/sprite_prop_train-goldmine{,_256}.png + sprite_train_goldmine_blender-render.png -> unused train sprite variants
          #        (the game loads only sprite_prop_train-goldmine_512.png: src/level/distant_train.gd, Ep2SurfaceSet). No reference by any name in
          #        code, scenes, resources or data; the blender-render file is only written by tools/ep2_blender/train_fidelity_pass.py (~1.0 MB pck, 2026-10-18).
          #   variant/thread_support=false -> non-threaded: no SharedArrayBuffer/
          #        COOP/COEP needed, so it boots on itch.io/iframes/mobile.
          #   html/head_include            -> loads web/web3.js (copied beside
          #        index.html post-export) so window.LilBluntWeb3 exists at boot.
          cat > export_presets.cfg << 'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="config.json,src/autoload/share_taglines.json"
          exclude_filter="*.yml,*.yaml,*.md,docs/*,tests/*,prompts/*,scripts/*,portals/*,portal-captures/*,node_modules/*,.godot-cache/*,artifacts/*,design/*,work-notes/*,tools/*,assets/keyart/*,src/assets/models/horse/assetfurnace/*,web_verify/*,web/game/*,src/assets/sprites/sprite_prop_train-goldmine.png,src/assets/sprites/sprite_prop_train-goldmine_256.png,src/assets/sprites/sprite_train_goldmine_blender-render.png,src/assets/portals/leaders/*,src/assets/logos/founder/ref_wrong_diamonds_banned.png,src/assets/logos/founder/ref_flaming_diamond_target.png,src/assets/logos/founder/ref_no_logos_in_gaps.png,src/assets/logos/founder/ref_stilts_gap_outline.png,src/assets/logos/founder/ref_squares_to_replace.png,src/assets/logos/founder/ref_pipe_masks_logo.png,src/assets/logos/founder/ref_mural_remove.png,src/assets/art/smoke_lounge_banner.png,src/assets/models/player_bow/bow_fps_view.png,src/episode2/extras/*,src/episode2/assets/town/dude_stable_owner*,src/episode2/assets/town/stable_assistant*"
          export_path="web/game/index.html"
          script_export_mode=1
          script_encryption_key=""

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include="<script src=\"web3.js\"></script>"
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          EOF

      - name: Import project (first pass)
        run: |
          # Exporting before the initial resource import settles can fail with a
          # blank "configuration errors" message — import in a separate pass first.
          timeout 300 "$GODOT_BIN" --headless --editor --quit 2>&1 | tee import.log | tail -20 || true
          # A corrupt project.godot silently truncates ProjectSettings in the
          # export (this is how the entire [input] section once vanished).
          # Fail loudly instead of shipping a broken pck.
          if grep -E "Error parsing .*project.godot|Couldn't load file .*project.godot" import.log; then
            echo "::error::project.godot failed to parse — aborting export"
            exit 1
          fi

      - name: Portal room gameplay and rendered visibility
        run: |
          set -euo pipefail
          # The first-pass import above quits before textures/class_names finish
          # importing; tests on a half-imported project fail with bogus parse errors.
          timeout 600 "$GODOT_BIN" --headless --import >/dev/null 2>&1 || true
          timeout 90 "$GODOT_BIN" --headless --script res://tests/portal_room_test.gd 2>&1 | tee portal-tests.log
          grep -q 'PORTAL ROOMS: ALL PASS' portal-tests.log
          timeout 60 "$GODOT_BIN" --headless --script res://tests/quiz_protocol_only_test.gd 2>&1 | tee quiz-tests.log
          grep -q 'QUIZ_PROTOCOL_ONLY: ALL PASS' quiz-tests.log
          timeout 90 "$GODOT_BIN" --headless res://tests/nft_issuer_test.tscn 2>&1 | tee nft-tests.log
          grep -q 'NFT_ISSUER: ALL PASS' nft-tests.log
          timeout 180 "$GODOT_BIN" --headless res://tests/transition_feedback_test.tscn 2>&1 | tee transition-feedback-tests.log
          grep -q 'TRANSITION_FEEDBACK: ALL PASS' transition-feedback-tests.log
          timeout 180 "$GODOT_BIN" --headless res://tests/transition2_test.tscn 2>&1 | tee transition2-tests.log
          grep -q 'TRANSITION2: ALL PASS' transition2-tests.log
          # The REAL hideout -> prebuilt lift -> prebuilt woods chain (founder 2026-10-25: no door pause, empty elevator, no rewind).
          timeout 300 "$GODOT_BIN" --headless res://tests/seamless_chain_test.tscn 2>&1 | tee seamless-chain-tests.log
          grep -q 'SEAMLESS_CHAIN: ALL PASS' seamless-chain-tests.log
          # Founder 2026-10-27 P0: held W crosses the elevator door; nobody walks through the forest bridge's rails; the quad-ride music blends.
          timeout 300 "$GODOT_BIN" --headless res://tests/ep2_door_stride_test.tscn 2>&1 | tee door-stride-tests.log
          grep -q 'EP2_DOOR_STRIDE: ALL PASS' door-stride-tests.log
          timeout 300 "$GODOT_BIN" --headless res://tests/ep2_exit_bridge_test.tscn 2>&1 | tee exit-bridge-tests.log
          grep -q 'EP2_EXIT_BRIDGE: ALL PASS' exit-bridge-tests.log
          timeout 120 "$GODOT_BIN" --headless res://tests/ep2_quad_music_test.tscn 2>&1 | tee quad-music-tests.log
          grep -q 'EP2_QUAD_MUSIC: ALL PASS' quad-music-tests.log
          # Photo-scanned PBR dressing + the CAD Colt Gatling (founder 2026-10-25 CAD pass): authored colour kept, period bronze, sightline clear.
          timeout 180 "$GODOT_BIN" --headless res://tests/ep2_pbr_test.tscn 2>&1 | tee ep2-pbr-tests.log
          grep -q 'EP2_PBR: ALL PASS' ep2-pbr-tests.log
          # The smelter's CAD prop kit (founder 2026-10-25 "not grey primitives"): every prop present, stand-in -> CAD upgrade, the hideout dressed with it.
          timeout 240 "$GODOT_BIN" --headless res://tests/ep2_smelter_kit_test.tscn 2>&1 | tee ep2-smelter-kit-tests.log
          grep -q 'EP2_SMELTER_KIT: ALL PASS' ep2-smelter-kit-tests.log
          # The town's CAD furniture (founder 2026-10-25 "more furnished furniture and subtle details"): every piece present, the old box -> CAD in place, rooms furnished, no story mark blocked.
          timeout 300 "$GODOT_BIN" --headless res://tests/ep2_town_furniture_test.tscn 2>&1 | tee ep2-town-furniture-tests.log
          grep -q 'EP2_TOWN_FURNITURE: ALL PASS' ep2-town-furniture-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' transition-feedback-tests.log; then exit 1; fi
          # On-screen touch controls: real finger events -> GUI -> InputMap -> the real
          # player (analog walk, multi-touch combo, release-on-hide, layouts on every screen).
          timeout 180 "$GODOT_BIN" --headless res://tests/mobile_touch_controls_test.tscn 2>&1 | tee touch-tests.log
          grep -q 'MOBILE_TOUCH_CONTROLS: ALL PASS' touch-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' touch-tests.log; then exit 1; fi
          # Pause menu (src/ui/pause_menu.gd): Escape / the touch pause button pause and resume the
          # real Stage 1 and Smoke Lounge, the hero freezes, power-up timers stop draining, Talk and
          # other modals keep their own Escape, a second thumb can tap Resume. It was dead code for
          # as long as it existed (InputEvent has no is_action_just_pressed), so keep it gated.
          timeout 180 "$GODOT_BIN" --headless res://tests/pause_menu_test.tscn 2>&1 | tee pause-tests.log
          grep -q 'PAUSE_MENU: ALL PASS' pause-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' pause-tests.log; then exit 1; fi
          # Vault NPC dialogues on a touch screen: Gideon's NEXT / CONFIRM STAKE / LEAVE buttons, and
          # proof that no stray tap (or GRAB) can stake GOLD without the explicit CONFIRM STAKE press.
          timeout 120 "$GODOT_BIN" --headless res://tests/vault_touch_dialogue_test.tscn 2>&1 | tee vault-touch-tests.log
          grep -q 'VAULT_TOUCH_DIALOGUE: ALL PASS' vault-touch-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' vault-touch-tests.log; then exit 1; fi
          timeout 120 "$GODOT_BIN" --headless --path . res://tests/ep2_bow_test.tscn > bow-tests.log 2>&1
          cat bow-tests.log
          grep -q 'EP2_BOW: ALL PASS' bow-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error' bow-tests.log; then exit 1; fi
          # Actual skinned paw contacts throughout reading/draw/release, plus
          # the deterministic actor clock and Bull's grip-preserving recoil.
          timeout 180 "$GODOT_BIN" --headless res://tests/ep2_character_motion_test.tscn 2>&1 | tee character-motion-tests.log
          grep -q 'EP2_CHARACTER_MOTION: ALL PASS' character-motion-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' character-motion-tests.log; then exit 1; fi
          # Session-owned guns, finite ammo, touch/controller swaps and atomic bear-loot retries.
          timeout 180 "$GODOT_BIN" --headless res://tests/ep2_personal_armory_test.tscn 2>&1 | tee personal-armory-tests.log
          grep -q 'EP2_PERSONAL_ARMORY: ALL PASS' personal-armory-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' personal-armory-tests.log; then exit 1; fi
          # Bears strike and bite the way a bear would: authored swipe/bite/walk/run clips bound to the rig (a mis-bound
          # export leaves a T-pose), the brain's attack choice and the blow landing at the clip's contact time.
          timeout 180 "$GODOT_BIN" --headless --path . res://tests/ep2_bear_attacks_test.tscn > bear-attacks-tests.log 2>&1
          cat bear-attacks-tests.log
          grep -q 'EP2_BEAR_ATTACKS: ALL PASS' bear-attacks-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' bear-attacks-tests.log | grep -v VirtualJoystick; then exit 1; fi
          # The town's life (founder 2026-10-18: the train, the river and the horses belong in Episode 2).
          timeout 180 "$GODOT_BIN" --headless --path . res://tests/ep2_town_life_test.tscn > town-life-tests.log 2>&1
          cat town-life-tests.log
          grep -q 'EP2_TOWN_LIFE: ALL PASS' town-life-tests.log
          timeout 240 "$GODOT_BIN" --headless res://tests/ep2_stable_yard_test.tscn 2>&1 | tee stable-yard-tests.log
          grep -q 'EP2_STABLE_YARD: ALL PASS' stable-yard-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' stable-yard-tests.log; then exit 1; fi
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' town-life-tests.log | grep -v VirtualJoystick; then exit 1; fi
          # The GoldMine town (founder 2026-10-14): the sheriff's office, the saloon, the draw (foul / retry / win), Bull, the chain.
          timeout 300 "$GODOT_BIN" --headless res://tests/ep2_gold_town_test.tscn 2>&1 | tee gold-town-tests.log
          grep -q 'EP2_GOLD_TOWN: ALL PASS' gold-town-tests.log
          timeout 240 "$GODOT_BIN" --headless res://tests/ep2_town_audio_test.tscn > town-audio-tests.log 2>&1
          grep -q 'EP2_TOWN_AUDIO: ALL PASS' town-audio-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' gold-town-tests.log; then exit 1; fi
          # Lil Blunt's crypto purse (founder 2026-10-24): ETH/BTC/WBTC/SOL/TitanX credited per pickup, spent per token at Rich's, drawn in the weapon tab.
          timeout 180 "$GODOT_BIN" --headless res://tests/ep2_purse_test.tscn > purse-tests.log 2>&1
          cat purse-tests.log
          grep -q 'EP2_PURSE: ALL PASS' purse-tests.log
          if grep -E 'SCRIPT ERROR|Parse Error|\[FAIL\]' purse-tests.log; then exit 1; fi
