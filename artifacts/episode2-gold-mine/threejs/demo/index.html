<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════════════════════════════
   Lil Blunt — Episode 2 "Gold Mine Runner": smelting-facility graphics demo.
   Everything here is procedural: geometry from primitives, all textures
   painted to <canvas> at runtime, all motion shader/CPU driven.
   No external assets are fetched (three.js itself aside).
   ══════════════════════════════════════════════════════════════════════ */

const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.fog = new THREE.FogExp2(0x0d0a09,0.023);

/* ── isometric camera ─────────────────────────────────────────────────── */
let zoom = 13.2;
const cam = new THREE.OrthographicCamera(-1,1,1,-1,0.1,260);
const camTarget = new THREE.Vector3(0,1.1,0);   // lazy-follow point
const camLook   = new THREE.Vector3(0,1.1,0);
let azim = Math.PI*0.26, elev = 0.54;
function sizeCam(){
  const a = innerWidth/innerHeight;
  cam.left=-zoom*a; cam.right=zoom*a; cam.top=zoom; cam.bottom=-zoom;
  cam.updateProjectionMatrix();
}
sizeCam();
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);sizeCam();});

/* ── procedural texture helpers ───────────────────────────────────────── */
function cv(s){const c=document.createElement('canvas');c.width=c.height=s;return c;}
function tex(c,rep=1){
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rep,rep);
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return t;
}
const R=(a,b)=>a+Math.random()*(b-a);
// value noise for canvas painting
function noiseCanvas(s,scale,oct,base){
  const c=cv(s),x=c.getContext('2d'),d=x.createImageData(s,s);
  const grid=[];for(let o=0;o<oct;o++){const n=Math.ceil(scale*(2**o))+1,g=[];
    for(let i=0;i<n*n;i++)g.push(Math.random());grid.push({n,g});}
  const smp=(gr,u,v)=>{const {n,g}=gr;const X=u*(n-1),Y=v*(n-1);
    const x0=Math.floor(X),y0=Math.floor(Y),fx=X-x0,fy=Y-y0;
    const i=(a,b)=>g[Math.min(n-1,b)*n+Math.min(n-1,a)];
    const sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
    return (i(x0,y0)*(1-sx)+i(x0+1,y0)*sx)*(1-sy)+(i(x0,y0+1)*(1-sx)+i(x0+1,y0+1)*sx)*sy;};
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    let v=0,amp=1,tot=0;
    for(let o=0;o<oct;o++){v+=smp(grid[o],x/s,y/s)*amp;tot+=amp;amp*=0.5;}
    v=v/tot; const p=(y*s+x)*4, g=Math.max(0,Math.min(255,(base+v*(255-base))|0));
    d.data[p]=d.data[p+1]=d.data[p+2]=g; d.data[p+3]=255;
  }
  x.putImageData(d,0,0); return c;
}
// derive a normal map from a heightfield canvas
function normalFrom(hc,strength=2.2){
  const s=hc.width,src=hc.getContext('2d').getImageData(0,0,s,s).data;
  const c=cv(s),x=c.getContext('2d'),d=x.createImageData(s,s);
  const H=(a,b)=>src[(((b+s)%s)*s+((a+s)%s))*4]/255;
  for(let y=0;y<s;y++)for(let x2=0;x2<s;x2++){
    const dx=(H(x2-1,y)-H(x2+1,y))*strength, dy=(H(x2,y-1)-H(x2,y+1))*strength;
    const l=Math.hypot(dx,dy,1), p=(y*s+x2)*4;
    d.data[p]=((dx/l)*.5+.5)*255; d.data[p+1]=((dy/l)*.5+.5)*255;
    d.data[p+2]=((1/l)*.5+.5)*255; d.data[p+3]=255;
  }
  x.putImageData(d,0,0); return c;
}

/* ── flagstone floor: albedo / roughness(+puddles) / normal ───────────── */
function flagstone(){
  const S=1024, a=cv(S), ax=a.getContext('2d');
  const h=cv(S), hx=h.getContext('2d');
  ax.fillStyle='#15120f'; ax.fillRect(0,0,S,S);
  hx.fillStyle='#3a3a3a'; hx.fillRect(0,0,S,S);
  // irregular flagstones on a jittered grid
  const N=7, cell=S/N;
  for(let gy=0;gy<N;gy++)for(let gx=0;gx<N;gx++){
    const px=gx*cell+R(3,9), py=gy*cell+R(3,9);
    const w=cell-R(7,15), ht=cell-R(7,15);
    const g=R(0.42,0.72);
    const col=`rgb(${(150*g)|0},${(134*g)|0},${(114*g)|0})`;
    // one shared irregular quad for BOTH albedo and height, so the stone
    // actually gets relief (the height pass previously called fill() with no
    // path, leaving the normal map flat — which is why joints never showed).
    const q=[[px+R(-3,3),py+R(-3,3)],[px+w+R(-3,3),py+R(-3,3)],
             [px+w+R(-3,3),py+ht+R(-3,3)],[px+R(-3,3),py+ht+R(-3,3)]];
    const quad=(c)=>{c.beginPath();c.moveTo(q[0][0],q[0][1]);
      for(let k=1;k<4;k++)c.lineTo(q[k][0],q[k][1]);c.closePath();c.fill();};
    ax.fillStyle=col; quad(ax);
    hx.fillStyle=`rgb(${(150+g*90)|0},${(150+g*90)|0},${(150+g*90)|0})`; quad(hx);
    // per-stone speckle
    for(let i=0;i<70;i++){
      const sx=px+Math.random()*w, sy=py+Math.random()*ht;
      ax.fillStyle=`rgba(${R(20,60)|0},${R(20,60)|0},${R(25,65)|0},${R(.05,.22)})`;
      ax.fillRect(sx,sy,R(1,4),R(1,4));
    }
  }
  // grout / cracks darken
  ax.globalAlpha=.5; ax.strokeStyle='#0b0d12'; ax.lineWidth=3;
  for(let gy=0;gy<=N;gy++){ax.beginPath();ax.moveTo(0,gy*cell);ax.lineTo(S,gy*cell);ax.stroke();}
  for(let gx=0;gx<=N;gx++){ax.beginPath();ax.moveTo(gx*cell,0);ax.lineTo(gx*cell,S);ax.stroke();}
  ax.globalAlpha=1;
  // grime blotches
  const nz=noiseCanvas(256,3,4,40);
  ax.globalAlpha=.35; ax.drawImage(nz,0,0,S,S); ax.globalAlpha=1;

  // roughness map: damp stone, gently varied — NO puddle holes here.
  const r=cv(S), rx=r.getContext('2d');
  rx.fillStyle='#8a8a8a'; rx.fillRect(0,0,S,S);
  const rn=noiseCanvas(256,4,4,110);
  rx.globalAlpha=.55; rx.drawImage(rn,0,0,S,S); rx.globalAlpha=1;
  return {albedo:tex(a,7), rough:tex(r,7), normal:tex(normalFrom(h,1.6),7)};
}

/* ── rock / stone-block textures ──────────────────────────────────────── */
function rockTex(tint,dark){
  const S=512,a=cv(S),ax=a.getContext('2d');
  ax.fillStyle=dark; ax.fillRect(0,0,S,S);
  const n=noiseCanvas(256,4,5,20);
  ax.globalAlpha=.85; ax.drawImage(n,0,0,S,S); ax.globalAlpha=1;
  ax.globalCompositeOperation='multiply';
  ax.fillStyle=tint; ax.fillRect(0,0,S,S);
  ax.globalCompositeOperation='source-over';
  // fractures
  ax.strokeStyle='rgba(0,0,0,.55)';
  for(let i=0;i<26;i++){
    ax.lineWidth=R(1,3); ax.beginPath();
    let x=Math.random()*S,y=Math.random()*S; ax.moveTo(x,y);
    for(let k=0;k<5;k++){x+=R(-70,70);y+=R(-70,70);ax.lineTo(x,y);} ax.stroke();
  }
  const h=noiseCanvas(256,5,5,60);
  return {albedo:tex(a),normal:tex(normalFrom(h,2.6))};
}

const FLOOR = flagstone();
const ROCK  = rockTex('#6d6152','#100d0a');
const BLOCK = rockTex('#8a7f6d','#2a251d');   // warmer masonry
const WOOD  = (()=>{
  const S=512,a=cv(S),ax=a.getContext('2d');
  ax.fillStyle='#3a2617'; ax.fillRect(0,0,S,S);
  for(let i=0;i<130;i++){                       // grain
    ax.strokeStyle=`rgba(${R(80,150)|0},${R(55,100)|0},${R(30,60)|0},${R(.08,.4)})`;
    ax.lineWidth=R(1,4); ax.beginPath();
    const y=Math.random()*S; ax.moveTo(0,y);
    for(let x=0;x<=S;x+=32) ax.lineTo(x,y+Math.sin(x*0.02+i)*R(2,7));
    ax.stroke();
  }
  const h=noiseCanvas(256,10,4,90);
  return {albedo:tex(a),normal:tex(normalFrom(h,1.5))};
})();

/* ── environment map (procedural: warm forge + cool cave) ─────────────── */
(function(){
  const s=new THREE.Scene();
  const back=new THREE.Mesh(new THREE.SphereGeometry(40,16,12),
    new THREE.MeshBasicMaterial({color:0x0a1018,side:THREE.BackSide}));
  s.add(back);
  const forge=new THREE.Mesh(new THREE.SphereGeometry(9,12,10),
    new THREE.MeshBasicMaterial({color:0xff7a1e}));
  forge.position.set(20,2,-6); s.add(forge);
  const cool=new THREE.Mesh(new THREE.SphereGeometry(12,12,10),
    new THREE.MeshBasicMaterial({color:0x1d3a5c}));
  cool.position.set(-14,18,10); s.add(cool);
  const pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader();
  scene.environment = pm.fromScene(s,0.05).texture;
})();

/* ── lighting ─────────────────────────────────────────────────────────── */
scene.add(new THREE.HemisphereLight(0x1a2433,0x2a1a08,0.22));   // blue cut ~60%
scene.add(new THREE.AmbientLight(0x4a3220,0.50));               // warm brown-black floor

// cool key from the tunnel mouth — the only shadow caster (perf)
const key = new THREE.DirectionalLight(0x8fb0dd,0.42);
key.position.set(-11,20,-13); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
const sc=key.shadow.camera;
sc.left=-26;sc.right=26;sc.top=26;sc.bottom=-26;sc.near=1;sc.far=70;
key.shadow.bias=-0.0012; key.shadow.normalBias=0.022;
scene.add(key);

// furnace: the warm heart of the frame
const forgeLight = new THREE.PointLight(0xff7d1e,620,46,2);
forgeLight.position.set(6.6,2.6,-4.4); scene.add(forgeLight);
const forgeGlow = new THREE.PointLight(0xffb257,300,24,2);
forgeGlow.position.set(6.2,1.3,-2.4); scene.add(forgeGlow);

const fill = new THREE.PointLight(0xffa552,42,22,2);
fill.position.set(-9.5,4.2,1.6); scene.add(fill);
const lanterns=[];
function lantern(x,y,z){
  const g=new THREE.Group(); g.position.set(x,y,z);
  const iron=new THREE.MeshStandardMaterial({color:0x1b1712,roughness:.55,metalness:.85});
  const cage=new THREE.Group();
  const cap=new THREE.Mesh(new THREE.ConeGeometry(.26,.16,6),iron); cap.position.y=.30;
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.19,.21,.07,8),iron); base.position.y=-.24;
  cage.add(cap,base);
  for(let i=0;i<4;i++){                       // corner posts only — see-through
    const post=new THREE.Mesh(new THREE.BoxGeometry(.035,.50,.035),iron);
    const a=i*Math.PI/2+Math.PI/4;
    post.position.set(Math.cos(a)*.17,.02,Math.sin(a)*.17);
    cage.add(post);
  }
  const glass=new THREE.Mesh(new THREE.BoxGeometry(.26,.36,.26),
    new THREE.MeshStandardMaterial({color:0xffb257,emissive:0xff9c33,
      emissiveIntensity:4.2,roughness:.3}));
  const hook=new THREE.Mesh(new THREE.CylinderGeometry(.022,.022,1.5,6),
    new THREE.MeshStandardMaterial({color:0x14110d,roughness:.6,metalness:.8}));
  hook.position.y=.95;
  const L=new THREE.PointLight(0xffa845,46,16,2); L.position.y=.02;
  g.add(cage,glass,hook,L);
  scene.add(g); lanterns.push({L,glass,seed:Math.random()*10,gl:glow(x,y,z,4.4,0.62,0xffb870)});
  return g;
}

/* ── world geometry ───────────────────────────────────────────────────── */
const matFloor = new THREE.MeshStandardMaterial({
  map:FLOOR.albedo, roughnessMap:FLOOR.rough, normalMap:FLOOR.normal,
  roughness:0.62, metalness:0.05, envMapIntensity:0.55,
  color:0xd8c6ad, normalScale:new THREE.Vector2(1.6,1.6)
});
// animated ripple + wet sheen inside puddles
// (ripples now live on the dedicated puddle meshes, not the whole floor)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(64,64), matFloor);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

/* puddles: thin dark discs just above the floor. Dark albedo + low roughness
   reads as standing water catching the forge light — the previous roughness-map
   approach blew out into white glowing discs. */
const puddles=[];
(function makePuddles(){
  const geo=new THREE.CircleGeometry(1,26);
  for(let i=0;i<11;i++){
    const m=new THREE.MeshStandardMaterial({
      color:0x2b2a28, roughness:0.03, metalness:0.0,
      envMapIntensity:1.4, transparent:true, opacity:0.38,
      depthWrite:false});
    m.onBeforeCompile=sh=>{
      sh.uniforms.uT={value:0}; m.userData.sh=sh;
      sh.vertexShader=sh.vertexShader.replace('#include <common>',
        '#include <common>\nvarying vec2 vPU;')
        .replace('#include <begin_vertex>','#include <begin_vertex>\n vPU=position.xy;');
      sh.fragmentShader=sh.fragmentShader.replace('#include <common>',
        '#include <common>\nuniform float uT;\nvarying vec2 vPU;')
        .replace('#include <normal_fragment_begin>',`
          #include <normal_fragment_begin>
          float rr=length(vPU);
          float w=sin(rr*17.0-uT*2.3)*0.5+sin((vPU.x+vPU.y)*11.0+uT*1.4)*0.5;
          normal=normalize(normal+vec3(w*0.035,0.0,w*0.035));`);
    };
    const d=new THREE.Mesh(geo,m);
    d.rotation.x=-Math.PI/2;
    const sc=R(1.1,2.9);
    d.position.set(R(-10,8),0.014,R(-7,8)); d.scale.set(sc,sc*R(.7,1.1),1);
    d.receiveShadow=false; scene.add(d); puddles.push(m);
  }
})();

const matRock  = new THREE.MeshStandardMaterial({map:ROCK.albedo,normalMap:ROCK.normal,
  roughness:.95,metalness:.04,envMapIntensity:.55,normalScale:new THREE.Vector2(1.5,1.5)});
const matBlock = new THREE.MeshStandardMaterial({map:BLOCK.albedo,normalMap:BLOCK.normal,
  roughness:.86,metalness:.05,envMapIntensity:.7,normalScale:new THREE.Vector2(1.2,1.2)});
const matWood  = new THREE.MeshStandardMaterial({map:WOOD.albedo,normalMap:WOOD.normal,
  roughness:.82,metalness:.02,envMapIntensity:.5});
const matIron  = new THREE.MeshStandardMaterial({color:0x2a2723,roughness:.42,metalness:.95,
  envMapIntensity:1.1});
const matGold  = new THREE.MeshStandardMaterial({color:0xffc247,emissive:0xff9418,
  emissiveIntensity:1.9,roughness:.18,metalness:1.0,envMapIntensity:1.8});

// cheap volumetric-ish glow billboard, stands in for a bloom pass
function glowTex(){
  const S=128,c=cv(S),x=c.getContext('2d');
  const g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
  g.addColorStop(0,'rgba(255,235,200,1)'); g.addColorStop(0.25,'rgba(255,170,70,0.55)');
  g.addColorStop(0.6,'rgba(255,110,30,0.16)'); g.addColorStop(1,'rgba(255,90,20,0)');
  x.fillStyle=g; x.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}
const GLOW=glowTex();
function glow(x,y,z,size,op,col=0xffb060){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:col,
    transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.position.set(x,y,z); s.scale.set(size,size,1); scene.add(s); return s;
}

const box=new THREE.BoxGeometry(1,1,1);
function addBox(mat,x,y,z,sx,sy,sz,ry=0,cast=true){
  const m=new THREE.Mesh(box,mat);
  m.position.set(x,y,z); m.scale.set(sx,sy,sz); m.rotation.y=ry;
  m.castShadow=cast; m.receiveShadow=true; scene.add(m); return m;
}

/* jagged rock walls framing the chamber (instanced for perf) */
(function walls(){
  const T=[];
  const push=(x,y,z,sx,sy,sz,ry)=>T.push({x,y,z,sx,sy,sz,ry});
  for(let i=0;i<130;i++){                       // left + right rock masses
    const side = i%2 ? 1 : -1;
    // the camera looks down -X/-Z, so +X/+Z is the near corner: keep the
    // right-hand mass pushed back behind the furnace or it occludes the frame.
    const x = side*(R(17,27));
    const z = side>0 ? R(-28,-2) : R(-28,12);
    push(x,R(-1,7),z,R(2.2,5.4),R(2.4,7.5),R(2.2,5.6),R(0,3.14));
  }
  for(let i=0;i<70;i++){                        // back wall mass
    push(R(-20,20),R(-1,8),R(-30,-22),R(2.4,5.6),R(2.6,8),R(2.4,5),R(0,3.14));
  }
  const im=new THREE.InstancedMesh(box,matRock,T.length);
  im.castShadow=im.receiveShadow=true;
  const d=new THREE.Object3D();
  T.forEach((t,i)=>{d.position.set(t.x,t.y,t.z);d.scale.set(t.sx,t.sy,t.sz);
    d.rotation.set(R(-.14,.14),t.ry,R(-.12,.12));d.updateMatrix();im.setMatrixAt(i,d.matrix);});
  scene.add(im);

  // glowing gold ore veins threaded through the rock
  const V=[];
  for(let c=0;c<9;c++){                       // clustered seams, not litter
    // must track the wall radius (17-27) and the same near-corner exclusion,
    // or the seams hang in open air detached from any rock.
    const side=c%2?1:-1, cy=R(1.2,5.0);
    const cz=side>0 ? R(-26,-4) : R(-26,10);
    for(let i=0;i<6;i++)
      V.push({x:side*R(16.0,17.6),y:cy+R(-.9,.9),z:cz+R(-1.6,1.6),
              sx:R(.16,.34),sy:R(.7,2.0),sz:R(.16,.34),rz:R(-.5,.5)});
  }
  const vm=new THREE.InstancedMesh(box,matGold,V.length);
  const dv=new THREE.Object3D();
  V.forEach((t,i)=>{dv.position.set(t.x,t.y,t.z);dv.scale.set(t.sx,t.sy,t.sz);
    dv.rotation.set(0,R(0,3.14),t.rz);dv.updateMatrix();vm.setMatrixAt(i,dv.matrix);});
  scene.add(vm);
})();

/* left-hand masonry facade. In this isometric, screen-left is the -X/+Z
   diagonal, so the wall runs along X at a slightly forward Z and is long
   enough to bleed off the left edge of frame (concept: x=0 to ~46% width). */
(function structure(){
  const WZ=-2.0;                       // facade plane
  const dark=new THREE.MeshStandardMaterial({color:0x07080b,roughness:1});
  // solid wall (not an open box) — 22 long, running off frame to the left
  addBox(matBlock,-14.0,3.1,WZ,22.0,6.2,1.0);
  addBox(matBlock,-14.0,6.6,WZ+0.15,22.4,0.8,1.4);          // cornice

  /* two arched doorways: recessed dark voids + half-round arch heads,
     with plank door slabs set into the right-hand one. */
  function doorway(x,w,h,withDoor){
    addBox(dark,x,h/2,WZ+0.55,w,h,0.35,0,false);
    const a=new THREE.Mesh(new THREE.CylinderGeometry(w/2,w/2,0.35,18,1,false,0,Math.PI),dark);
    a.rotation.x=Math.PI/2; a.rotation.z=Math.PI; a.position.set(x,h,WZ+0.55);
    scene.add(a);
    // stone voussoir ring around the arch
    const v=new THREE.Mesh(new THREE.TorusGeometry(w/2+0.16,0.19,6,20,Math.PI),matBlock);
    v.position.set(x,h,WZ+0.62); scene.add(v);
    if(withDoor){
      addBox(matWood,x,h*0.46,WZ+0.66,w*0.86,h*0.9,0.14);
      addBox(matIron,x,h*0.46,WZ+0.74,w*0.86,0.13,0.06);     // strap band
    }
  }
  doorway(-16.5,2.6,3.3,false);
  doorway(-9.8,2.4,3.1,true);

  // heavy timber posts + lintel + diagonal braces across the facade

(function furnace(){
  const X=7.6,Z=-2.6;

  // must live on the +Z face or it renders as a featureless black mass.
  addBox(matBlock,X,5.2,Z-1.4,10.4,10.4,6.6);               // stack

  const dark=new THREE.MeshStandardMaterial({color:0x090705,roughness:1});
  const mMat=new THREE.MeshStandardMaterial({color:0x2a1a08,emissive:0xff6a08,
    emissiveIntensity:2.4,roughness:.35,metalness:.2});

  /* arched fire mouth cut into the camera-facing (+Z) face: a dark recess
     with an emissive interior, and a half-round arch head on top. */
  const MZ=Z+1.9;
  addBox(dark,X-0.6,2.05,MZ,4.2,4.1,0.7,0,false);
  const archD=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,0.7,20,1,false,0,Math.PI),
    dark); archD.rotation.x=Math.PI/2; archD.rotation.z=Math.PI;

  addBox(mMat,X-0.6,2.0,MZ+0.30,3.8,3.8,0.12,0,false);      // glowing interior
  const archG=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,0.12,20,1,false,0,Math.PI),
    mMat); archG.rotation.x=Math.PI/2; archG.rotation.z=Math.PI;
  archG.position.set(X-0.6,3.9,MZ+0.30); scene.add(archG);
  // hot stone lip around the aperture
  const lip=new THREE.PointLight(0xff6a10,90,9,2);
  lip.position.set(X-0.6,2.6,MZ+1.4); scene.add(lip);

  /* crucible — the brightest object in frame. Stone plinth, iron rim ring,
     fully emissive gold top. (Judge: ~3x the old diameter.) */
  const CX=X-1.4, CZ=Z+5.6;
  const plinth=new THREE.Mesh(new THREE.CylinderGeometry(2.9,3.3,0.55,22),matBlock);
  plinth.position.set(CX,0.27,CZ); plinth.castShadow=plinth.receiveShadow=true;
  scene.add(plinth);
  const cru=new THREE.Mesh(new THREE.CylinderGeometry(2.55,2.15,1.25,24),matIron);
  cru.position.set(CX,1.15,CZ); cru.castShadow=cru.receiveShadow=true; scene.add(cru);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(2.55,0.16,8,26),matIron);
  rim.rotation.x=Math.PI/2; rim.position.set(CX,1.76,CZ);
  rim.castShadow=true; scene.add(rim);
  const pool=new THREE.Mesh(new THREE.CircleGeometry(2.45,28),
    new THREE.MeshStandardMaterial({color:0x3a2408,emissive:0xff9412,
      emissiveIntensity:2.6,roughness:.25}));
  pool.rotation.x=-Math.PI/2; pool.position.set(CX,1.79,CZ); scene.add(pool);

  /* vertical molten flame column rising out of the crucible — the loudest
     element of the concept and previously absent entirely. Stacked additive
     cones: white-hot core, orange sheath. */
  const flameMats=[];
  const mkFlame=(r0,r1,h,y,col,op)=>{
    const fm=new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      side:THREE.DoubleSide,
      uniforms:{uT:{value:0},uC:{value:new THREE.Color(col)},uO:{value:op}},
      vertexShader:`varying vec2 vU;void main(){vU=uv;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`varying vec2 vU;uniform float uT,uO;uniform vec3 uC;
        float h(vec2 p){return fract(sin(dot(p,vec2(37.1,91.7)))*43758.5);}
        float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(h(i),h(i+vec2(1,0)),f.x),
                     mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
        void main(){
          // licking tongues: noise scrolling up the column
          float lick=n(vec2(vU.x*7.0, vU.y*4.0 - uT*1.9))*0.55
                   + n(vec2(vU.x*15.0, vU.y*9.0 - uT*3.4))*0.30;
          // fade out toward the tip, and soften the rim so it is not a hard cone
          float body=1.0-smoothstep(0.18,0.98,vU.y);
          float rim =sin(vU.x*3.14159);
          float a=uO*body*(0.55+lick)*(0.45+0.55*rim);
          if(a<0.004) discard;
          gl_FragColor=vec4(uC,a);
        }`});
    const c=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,h,18,1,true),fm);
    c.position.set(CX,y,CZ); scene.add(c); flameMats.push({m:c,fm,y});
    return c;
  };
  mkFlame(1.55,0.35,5.4,4.4,0xff6a10,0.50);   // outer sheath
  mkFlame(0.95,0.16,4.8,4.1,0xffa62c,0.55);   // mid
  mkFlame(0.48,0.06,4.0,3.7,0xffe9b0,0.60);   // white-hot core
  const jetL=new THREE.PointLight(0xffb64a,260,20,2);
  jetL.position.set(CX,3.6,CZ); scene.add(jetL);
  glow(CX,2.2,CZ,7.0,0.55);
  glow(X-0.6,3.0,MZ+0.9,7.2,0.55);

  molten.push(mMat,pool.material,archG);
  window.__flame={flameMats,jetL,lip};

  // reflected pour of light on the wet floor beneath the crucible
  const spill=new THREE.Mesh(new THREE.CircleGeometry(5.4,30),
    new THREE.MeshBasicMaterial({color:0xff8a20,transparent:true,opacity:.13,
      blending:THREE.AdditiveBlending,depthWrite:false}));

})();

function pointCloud(n,spread,color,size,opacity){
  const g=new THREE.BufferGeometry(), p=new Float32Array(n*3), v=[];
  for(let i=0;i<n;i++){
    p[i*3]=R(-spread,spread); p[i*3+1]=R(0.2,9); p[i*3+2]=R(-spread,spread);
    v.push({x:R(-.06,.06),y:R(.02,.14),z:R(-.06,.06)});

  const m=new THREE.PointsMaterial({color,size,transparent:true,opacity,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  const pts=new THREE.Points(g,m); scene.add(pts); return {pts,v,p,n};
}

/* ── controls: click-to-move, drag-orbit, scroll-zoom ─────────────────── */
const ZONE={minX:-13,maxX:11,minZ:-9,maxZ:11};   // playable chamber + track
const dest=new THREE.Vector3(-2.5,0,2.5);
let moving=false, facing=0;
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0);

let dragging=false,dragged=false,lx=0,ly=0;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{dragging=true;dragged=false;lx=e.clientX;ly=e.clientY;});
addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(Math.abs(dx)+Math.abs(dy)>3) dragged=true;
  azim-=dx*0.006; elev=Math.max(0.35,Math.min(1.35,elev+dy*0.004));
  lx=e.clientX; ly=e.clientY;
});
addEventListener('pointerup',e=>{
  if(dragging&&!dragged){
    ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(ndc,cam);
    const hit=new THREE.Vector3();
    if(ray.ray.intersectPlane(groundPlane,hit)){
      dest.set(Math.max(ZONE.minX,Math.min(ZONE.maxX,hit.x)),0,
               Math.max(ZONE.minZ,Math.min(ZONE.maxZ,hit.z)));
      moving=true;
    }
  }
  dragging=false;
});
addEventListener('wheel',e=>{zoom=Math.max(7,Math.min(30,zoom+e.deltaY*0.012));sizeCam();},
  {passive:true});

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  /* player movement + facing */
  const toD=dest.clone().sub(blunt.position); toD.y=0;
  const dist=toD.length();
  if(moving&&dist>0.12){
    toD.normalize();
    blunt.position.addScaledVector(toD,Math.min(3.1*dt,dist));
    facing=Math.atan2(toD.x,toD.z);
  } else moving=false;
  let fd=facing-blunt.rotation.y;
  while(fd>Math.PI)fd-=Math.PI*2; while(fd<-Math.PI)fd+=Math.PI*2;
  blunt.rotation.y+=fd*Math.min(1,dt*9);

  /* character animation — walk cycle vs idle */
  const sp=moving?1:0;
  const gait=t*9.5;
  bParts.legL.rotation.x =  Math.sin(gait)*0.75*sp;
  bParts.legR.rotation.x = -Math.sin(gait)*0.75*sp;
  bParts.armL.rotation.x = -Math.sin(gait)*0.6*sp + (1-sp)*Math.sin(t*1.6)*0.05;
  bParts.armR.rotation.x =  Math.sin(gait)*0.6*sp - (1-sp)*Math.sin(t*1.6)*0.05;
  bParts.root.position.y = sp?Math.abs(Math.sin(gait))*0.075:Math.sin(t*1.5)*0.022;
  bParts.root.rotation.z = sp?Math.sin(gait)*0.045:Math.sin(t*1.5)*0.012;
  bParts.head.rotation.y = (1-sp)*Math.sin(t*0.55)*0.28;
  bParts.head.rotation.z = (1-sp)*Math.sin(t*0.8)*0.05;
  bParts.cig.material.emissiveIntensity = 4.5+Math.sin(t*3.1)*2.2;

  /* bull idle: breathing, tail flick, head turn */
  uParts.torso.scale.set(1.15,1.15+Math.sin(t*1.15)*0.022,0.80);
  uParts.head.rotation.y=Math.sin(t*0.4)*0.22;
  uParts.head.rotation.x=Math.sin(t*0.62)*0.05;
  uParts.tail.rotation.z=Math.sin(t*2.3)*0.35+Math.sin(t*0.7)*0.15;
  uParts.armR.rotation.x=Math.sin(t*0.9)*0.06;
  uParts.cig.material.emissiveIntensity=5+Math.sin(t*2.4+1.4)*2.5;

  /* lantern flicker (two-rate noise so it reads as flame, not a sine) */
  for(const L of lanterns){
    const f=0.72+Math.sin(t*11+L.seed)*0.13+Math.sin(t*27.3+L.seed*3)*0.08
            +Math.sin(t*3.1+L.seed)*0.07;
    L.L.intensity=46*f; L.glass.material.emissiveIntensity=4.2*f;
    if(L.gl) L.gl.material.opacity=0.55*f;
  }
  /* furnace breathing */
  const ff=1+Math.sin(t*2.1)*0.10+Math.sin(t*6.7)*0.05;
  forgeLight.intensity=210*ff; forgeGlow.intensity=95*ff;
  if(window.__flame){
    const F=window.__flame;
    F.jetL.intensity=105*ff;
    F.lip.intensity=42*ff;
    // flame column licks and breathes
    F.flameMats.forEach((f,i)=>{
      const w=1+Math.sin(t*(5.5+i*1.7)+i)*0.13+Math.sin(t*13.1+i*2)*0.06;
      f.m.scale.set(w,1+Math.sin(t*(4.1+i))*0.09,w);
      f.fm.uniforms.uT.value=t;
      f.fm.uniforms.uO.value=(i===2?0.60:i===1?0.55:0.50)*(0.88+Math.sin(t*9.3+i*2.1)*0.12);
    });
  }
  molten[0].emissiveIntensity=2.4*ff; molten[1].emissiveIntensity=2.6*ff;

  /* wet-floor ripples + haze + god-ray shimmer */
  for(const m of puddles) if(m.userData.sh) m.userData.sh.uniforms.uT.value=t;
  haze.material.uniforms.uT.value=t;
  for(const s of shafts) s.c.material.opacity=0.052+Math.sin(t*0.7+s.seed)*0.014;

  /* dust drift */
  for(let i=0;i<dust.n;i++){
    const v=dust.v[i];
    dust.p[i*3]  +=v.x*dt*3; dust.p[i*3+1]+=v.y*dt*0.5; dust.p[i*3+2]+=v.z*dt*3;
    if(dust.p[i*3+1]>9.5){dust.p[i*3+1]=0.2;dust.p[i*3]=R(-22,22);dust.p[i*3+2]=R(-22,22);}
  }
  dust.pts.geometry.attributes.position.needsUpdate=true;
  /* embers rise from the furnace */
  for(let i=0;i<embers.n;i++){
    const v=embers.v[i];
    embers.p[i*3]+=v.x*dt*2; embers.p[i*3+1]+=(v.y+0.5)*dt*2.4; embers.p[i*3+2]+=v.z*dt*2;
    if(embers.p[i*3+1]>7){embers.p[i*3+1]=0.2;embers.p[i*3]=R(-1.6,1.6);
      embers.p[i*3+2]=R(-1.6,1.6);}
  }
  embers.pts.geometry.attributes.position.needsUpdate=true;
  /* cigar smoke */
  for(const S of [smokeB,smokeU]){
    const o=S.anchor.localToWorld(S.off.clone());
    for(let i=0;i<S.n;i++){
      const s=S.st[i]; s.t+=dt*0.34;
      if(s.t>1){s.t=0;s.ox=R(-.02,.02);s.oz=R(-.02,.02);}
      S.p[i*3]  =o.x+(s.ox||0)*60*s.t+Math.sin(s.t*6+i)*0.06;
      S.p[i*3+1]=o.y+s.t*0.85;
      S.p[i*3+2]=o.z+(s.oz||0)*60*s.t+Math.cos(s.t*5+i)*0.05;
    }
    S.pts.geometry.attributes.position.needsUpdate=true;
    S.pts.material.opacity=0.3;
  }
  /* falling pebbles */
  for(let i=0;i<peb.length;i++){
    const p=peb[i]; p.vy-=9.8*dt*0.35; p.y+=p.vy*dt;
    if(p.y<0.05){p.y=R(7,13);p.vy=0;p.x=R(-14,14);p.z=R(-20,8);}
    p.d.position.set(p.x,p.y,p.z); p.d.scale.setScalar(p.s);
    p.d.rotation.set(p.y*2,p.y*1.6,p.y*1.2); p.d.updateMatrix();
    peb.im.setMatrixAt(i,p.d.matrix);
  }
  peb.im.instanceMatrix.needsUpdate=true;

  /* lazy-follow isometric camera */
  camTarget.set(blunt.position.x+2.2,2.1,blunt.position.z-2.6);
  camLook.lerp(camTarget,1-Math.pow(0.0015,dt));
  const d=40;
  cam.position.set(camLook.x+Math.sin(azim)*Math.cos(elev)*d,
                   camLook.y+Math.sin(elev)*d,
                   camLook.z+Math.cos(azim)*Math.cos(elev)*d);
  cam.lookAt(camLook);
  key.position.set(camLook.x-11,20,camLook.z-13);
  key.target.position.copy(camLook); key.target.updateMatrixWorld();

  renderer.render(scene,cam);

  fpsN++; fpsT+=dt;
  if(fpsT>0.5){const f=Math.round(fpsN/fpsT);fpsEl.textContent=f+' fps';
    window.__fps=f; fpsN=0;fpsT=0;}
}
animate();
window.__ready=true;
</script>
</body>
</html>
